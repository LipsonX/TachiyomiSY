name: APK Builder

# Produces an installable APK as a workflow artifact — no signing secrets needed.
#
#   debug  : assembled with the throwaway debug key GitHub Actions' runner provides, so it is
#            directly installable. No minification, so it is ~2x the size of a release APK.
#   foss   : minified + resource-shrunk (what upstream ships, ~32 MB per ABI). Unsigned by
#            default, so this workflow signs it with a freshly generated key: installable, but
#            its signature will not match a previously installed foss build from another key,
#            and it is NOT the upstream release key (auto-updates from upstream won't accept it).
#
# Triggers: push to master, or run it manually (the dropdown lets you pick the variant).
# Upstream's "Release Builder" (build_push.yml) only runs on the `release` branch and needs the
# signing / google-services / client-secrets secrets, which this fork does not have.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build type'
        type: choice
        options:
          - debug
          - foss
        default: debug
      all_abis:
        description: 'Upload every ABI + universal (default: arm64-v8a only)'
        type: boolean
        default: false
  push:
    branches:
      - master

concurrency:
  group: apk-builder-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.variant || 'debug' }}
    runs-on: ubuntu-latest

    env:
      BUILD_TASK: ${{ inputs.variant == 'foss' && ':app:assembleFoss' || ':app:assembleDebug' }}
      APK_DIR: ${{ inputs.variant == 'foss' && 'foss' || 'debug' }}

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          # COMMIT_COUNT / COMMIT_SHA buildConfig fields read git history, so no shallow clone.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build app
        run: ./gradlew -I .github/gradle/jitpack-fallbacks.gradle ${{ env.BUILD_TASK }} --console=plain

      - name: Sign with a throwaway key
        if: inputs.variant == 'foss'
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore /tmp/throwaway.keystore \
            -storepass android -keypass android -alias throwaway \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Throwaway Debug,OU=Android,O=Android,C=US"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in app/build/outputs/apk/${{ env.APK_DIR }}/*-unsigned.apk; do
            "$build_tools/apksigner" sign --ks /tmp/throwaway.keystore \
              --ks-pass pass:android --key-pass pass:android "$apk"
            mv "$apk" "${apk%-unsigned.apk}-selfsigned.apk"
          done

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: TachiyomiSY-${{ github.ref_name }}-${{ env.APK_DIR }}-arm64-v8a
          path: app/build/outputs/apk/${{ env.APK_DIR }}/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK (all ABIs)
        if: inputs.all_abis
        uses: actions/upload-artifact@v7
        with:
          name: TachiyomiSY-${{ github.ref_name }}-${{ env.APK_DIR }}-all-abis
          path: app/build/outputs/apk/${{ env.APK_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 14
